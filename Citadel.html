      }); break;
    }
    case 'marshal': {
      const ts=r8Targets(0,'seize').filter(x=>x.price<=p.gold);
      if(!ts.length){ toast('점령할 수 있는 건물이 없습니다'); return; }
      targetCity('점령할 건물 (건설비 3 이하)', ts, x=>{
        const tt=ts.find(y=>y.u===x.u);
        modal(`${P0(tt.id).nm} 점령`, [{t:`금화 ${tt.price}닢을 주고 점령`,v:1},{t:'취소',v:0}],
          v=>{ if(v) applyAction(0,{k:'ab',ch:'marshal',t:tt}); });
      }); break;
    }
    case 'diplomat': {
      const ts=r8Targets(0,'swap');
      if(!ts.length||!p.city.length){ toast('교환할 건물이 없습니다'); return; }
      targetCity('상대 도시에서 가져올 건물', ts, x=>{
        const tt=ts.find(y=>y.u===x.u);
        targetCity('내줄 내 건물', p.city.filter(c=>c.id!=='keep').map(c=>({pi:0,u:c.u,id:c.id})), m=>{
          const payv=Math.max(0, tt.base-P0(m.id).cost)+tt.extra;
          if(payv>p.gold){ toast(`금화 ${payv}닢이 필요합니다`); return; }
          applyAction(0,{k:'ab',ch:'diplomat',t:tt,mine:m.u,pay:payv});
        });
      }); break;
    }
  }
}

function seerGive(pi,id){
  const p=G.P[pi], o=G.P[opp(pi)];
  p.hand.splice(p.hand.indexOf(id),1); o.hand.push(id);
  say('예언자: 상대에게 카드 1장을 돌려줬습니다.');
  refresh();
  if(p.isAI && G.turn && !G.turn.ended) aiStep(aiTurn);
}
function openSeerGive(pi){
  const p=G.P[pi];
  const row=el('div','hrow');
  p.hand.forEach(id=>row.appendChild(cardNode(id,{mini:true,onclick:()=>{closeModal();seerGive(pi,id);}})));
  modalRaw('상대에게 돌려줄 카드 1장', row, []);
}

/* ══════════════════════════════════════════════════════════════
   16. 기록 · 결과
   ══════════════════════════════════════════════════════════════ */
function renderLog(){
  const b=$('#logbox'); if(!b) return;
  b.innerHTML='';
  G.log.slice(-260).forEach(e=>{
    const n=el('div', e.rh?'rh':'le'); n.innerHTML=e.t; b.appendChild(n);
  });
  b.scrollTop=b.scrollHeight;
}

function showResult(){
  const {a,b,winner}=G.result;
  const box=el('div');
  box.appendChild(el('div','big', winner===0?'승리!':winner===1?'패배…':'무승부'));
  box.appendChild(el('div','center tiny muted',`${a.total} : ${b.total}`));
  [[0,a],[1,b]].forEach(([pi,r])=>{
    box.appendChild(el('div','sep'));
    const h=el('div'); h.style.fontWeight='800'; h.style.color='var(--gold)';
    h.textContent=`${G.P[pi].name} — ${r.total}점`; box.appendChild(h);
    r.detail.forEach(([k,v])=>{
      const row=el('div','scorerow');
      row.appendChild(el('span',null,k)); row.appendChild(el('span','v',(v>=0?'+':'')+v));
      box.appendChild(row);
    });
    const c=el('div','city'); G.P[pi].city.forEach(x=>c.appendChild(dchip(x.id,{}))); box.appendChild(c);
  });
  modalRaw('게임 결과', box, [{t:'새 게임', cls:'primary', fn:()=>location.reload()},{t:'닫기'}]);
}

/* ══════════════════════════════════════════════════════════════
   17. 시작 화면
   ══════════════════════════════════════════════════════════════ */
const DEFAULT_CHARS = ['assassin','thief','magician','king','bishop','merchant','architect','warlord'];
const STARTER14 = ['factory','smithy','library','thievesden','statue','dragongate','magicschool',
                   'wishingwell','laboratory','keep','haunted','treasury','maproom','quarry'];

const cfg = {
  diff:'jieun',
  chars: DEFAULT_CHARS.slice(),
  uniqMode:'random14',      // 'random14' | 'starter14' | 'all30'
};

function buildStart(){
  const s=$('#start'); s.innerHTML=''; s.classList.remove('off');
  s.appendChild(el('h1','','시타델'));
  s.appendChild(el('div','sub','1 : 1  ·  2인 전용'));

  /* 난이도 */
  const d1=el('div','sect'); d1.appendChild(el('h3',null,'상대 난이도'));
  const dl=el('div','diffs');
  DIFFS.forEach(d=>{
    const b=el('button','diff'+(cfg.diff===d.id?' sel':''));
    b.appendChild(el('div','em',d.em));
    const c=el('div');
    c.appendChild(el('div','t',`${d.nm}  ·  ${d.tier}`));
    c.appendChild(el('div','d',d.desc));
    b.appendChild(c);
    b.onclick=()=>{ cfg.diff=d.id; buildStart(); };
    dl.appendChild(b);
  });
  d1.appendChild(dl); s.appendChild(d1);

  /* 캐릭터 선택 */
  const d2=el('div','sect');
  const h=el('h3',null,'캐릭터 구성 (순번 1~8)'); d2.appendChild(h);
  for(let r=1;r<=8;r++){
    const row=el('div','rankrow');
    row.appendChild(el('div','rn',String(r)));
    const vs=el('div','vsel');
    CHARS.filter(c=>c.rank===r).forEach(c=>{
      const cur = cfg.chars.find(x=>CH[x].rank===r);
      const o=el('button','vopt'+(cur===c.id?' sel':'')+(c.no2p?' dis':''), c.nm);
      o.onclick=()=>{ cfg.chars=cfg.chars.filter(x=>CH[x].rank!==r); cfg.chars.push(c.id); buildStart(); };
      vs.appendChild(o);
    });
    row.appendChild(vs); d2.appendChild(row);
  }
  const rowb=el('div','row'); rowb.style.marginTop='8px';
  rowb.appendChild(mk('기본 8인','ghost sm grow',()=>{cfg.chars=DEFAULT_CHARS.slice();buildStart();}));
  rowb.appendChild(mk('무작위','ghost sm grow',()=>{
    cfg.chars=[]; for(let r=1;r<=8;r++) cfg.chars.push(pick(CHARS.filter(c=>c.rank===r&&!c.no2p)).id);
    buildStart();
  }));
  d2.appendChild(rowb);
  d2.appendChild(el('div','tiny muted','※ 2인 게임에서 황제는 사용할 수 없습니다 (규칙서 7p)'));
  s.appendChild(d2);

  /* 특수 건물 */
  const d3=el('div','sect'); d3.appendChild(el('h3',null,'특수 건물'));
  const modes=[
    ['random14','무작위 14종','30종 중 14종을 매 게임 무작위로'],
    ['starter14','입문 14종','규칙서 3p 첫 게임 목록'],
    ['all30','30종 전부','기본 54장 + 특수 30장 = 84장'],
  ];
  const ml=el('div','diffs');
  modes.forEach(([id,t,dd])=>{
    const b=el('button','diff'+(cfg.uniqMode===id?' sel':''));
    const c=el('div'); c.appendChild(el('div','t',t)); c.appendChild(el('div','d',dd));
    b.appendChild(c); b.onclick=()=>{cfg.uniqMode=id;buildStart();};
    ml.appendChild(b);
  });
  d3.appendChild(ml); s.appendChild(d3);

  const go=el('button','btn primary wide','게임 시작');
  go.style.padding='14px'; go.style.fontSize='16px';
  go.onclick=()=>{
    if(cfg.chars.length!==8){ toast('순번 1~8을 모두 골라주세요'); return; }
    if(cfg.chars.includes('emperor')){ toast('2인 게임에서 황제는 쓸 수 없습니다'); return; }
    s.classList.add('off');
    startGame(cfg.diff, cfg.chars, chooseUniques());
  };
  s.appendChild(go);
  s.appendChild(el('div','tiny muted center','8번째 건물이 지어지면 그 라운드 끝에 게임이 종료됩니다.'));
}
function mk(t,cls,fn){ const b=el('button','btn '+cls,t); b.onclick=fn; return b; }

function chooseUniques(){
  const all=UNIQUE.map(u=>u.id);
  if(cfg.uniqMode==='all30') return all;
  if(cfg.uniqMode==='starter14') return STARTER14.slice();
  return shuffle(all.slice()).slice(0,14);
}

/* ══════════════════════════════════════════════════════════════
   18. 초기화
   ══════════════════════════════════════════════════════════════ */
$('#btnChars').onclick=()=>showChars();
$('#btnLog').onclick=()=>{ renderLog(); $('#logwrap').classList.add('on'); };
$('#btnLogClose').onclick=()=>$('#logwrap').classList.remove('on');
$('#btnMenu').onclick=()=>{
  modal('메뉴',[
    {t:'규칙 요약', v:'rules'},
    {t:'캐릭터 능력 보기', v:'chars'},
    {t:'새 게임', v:'new'},
  ], v=>{
    if(v==='new'){ if(confirm('새 게임을 시작할까요?')) location.reload(); }
    if(v==='rules') showRules();
    if(v==='chars') showChars();
  });
};
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };

function showRules(){
  const b=el('div'); b.style.fontSize='12.5px'; b.style.lineHeight='1.65';
  b.innerHTML = `
  <b style="color:var(--gold)">2인 게임 규칙 (규칙서 7p)</b><br>
  · 순번 1~8 캐릭터를 사용합니다. <b>황제는 사용 불가</b>.<br>
  · 캐릭터 8장 중 1장을 무작위로 뒷면으로 버립니다.<br>
  · 왕관 주인이 7장을 보고 1장을 가진 뒤 나머지를 상대에게 넘깁니다.<br>
  · 이후 서로 <b>2장을 골라 1장은 갖고 1장은 뒷면으로 버리기</b>를 반복 → 각자 캐릭터 2명.<br>
  · 각자 매 라운드 차례를 2번(캐릭터마다 1번) 진행합니다. 도시·금고는 하나만 운용합니다.<br>
  · 능력은 <b>해당 캐릭터의 차례에만</b> 발휘됩니다.<br>
  · <b>8번째 건물</b>이 건설되면 도시 완성, 그 라운드가 끝나면 게임 종료.<br><br>
  <b style="color:var(--gold)">차례</b><br>
  1) 자원 수집 (필수) — 금화 2닢 <i>또는</i> 카드 2장 중 1장 보유<br>
  2) 건설 (선택) — 기본 1채<br>
  *) 캐릭터 능력 — 차례 중 한 번<br><br>
  <b style="color:var(--gold)">점수</b><br>
  · 건설비용 합계<br>
  · 5종류(귀족·종교·상업·군사·특수) 전부 건설 시 +3<br>
  · 가장 먼저 도시 완성 +4 / 그 외 완성 +2<br>
  · 특수 건물 추가 점수`;
  modalRaw('규칙 요약', b, [{t:'닫기'}]);
}
function showChars(){
  const b=el('div');
  const list = G? G.chars : cfg.chars;
  list.slice().sort((x,y)=>CH[x].rank-CH[y].rank).forEach(id=>{
    const r=el('div'); r.style.padding='7px 0'; r.style.borderBottom='1px solid #ffffff12';
    const h=el('div'); h.style.fontWeight='800'; h.style.color='var(--gold)';
    h.textContent=`${CH[id].rank}. ${CH[id].nm}`;
    r.appendChild(h);
    const d=el('div','tiny muted',CH[id].ab); r.appendChild(d);
    b.appendChild(r);
  });
  modalRaw('이번 게임의 캐릭터', b, [{t:'닫기'}]);
}

buildStart();
</script>
